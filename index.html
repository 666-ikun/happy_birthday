<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爸爸45岁生日快乐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fad0c4);
            font-family: 'Arial', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            text-align: center;
            padding: 40px;
            background-color: rgba(255, 255, 255, 0.85);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 800px;
            width: 90%;
            position: relative;
            z-index: 10;
            animation: fadeIn 1s ease-in-out;
        }
        
        h1 {
            font-size: 3rem;
            color: #ff6b6b;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            animation: bounce 2s infinite;
        }
        
        h2 {
            font-size: 2rem;
            color: #4ecdc4;
            margin-bottom: 30px;
        }
        
        .message {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #333;
            margin-bottom: 30px;
        }
        
        .age {
            font-size: 4rem;
            color: #ff6b6b;
            font-weight: bold;
            margin: 20px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .gift-box {
            width: 100px;
            height: 100px;
            background-color: #ffd166;
            margin: 20px auto;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(15deg);
            animation: rotate 5s infinite linear;
        }
        
        .gift-box:before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #ffd166;
            top: 0;
            left: 0;
            transform: translateZ(50px);
            box-shadow: 0 0 0 2px #333;
        }
        
        .gift-box:after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #ffd166;
            top: 0;
            left: 0;
            transform: rotateY(90deg) translateZ(50px);
            box-shadow: 0 0 0 2px #333;
        }
        
        .gift-ribbon {
            position: absolute;
            width: 120px;
            height: 20px;
            background-color: #ff6b6b;
            top: 40px;
            left: -10px;
            z-index: 1;
        }
        
        .gift-ribbon:before {
            content: '';
            position: absolute;
            width: 20px;
            height: 120px;
            background-color: #ff6b6b;
            top: -50px;
            left: 50px;
            z-index: 1;
        }
        
        .buttons {
            margin-top: 30px;
        }
        
        button {
            padding: 12px 24px;
            margin: 0 10px;
            background-color: #4ecdc4;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        button:hover {
            background-color: #ff6b6b;
            transform: translateY(-3px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
        }
        
        .balloon {
            position: absolute;
            width: 40px;
            height: 50px;
            background-color: #ff6b6b;
            border-radius: 50%;
            z-index: 1;
            animation: float 5s infinite ease-in-out;
        }
        
        .balloon:before {
            content: '';
            position: absolute;
            width: 10px;
            height: 15px;
            background-color: #ff6b6b;
            bottom: -10px;
            left: 15px;
            border-radius: 0 0 50% 50%;
        }
        
        .balloon:after {
            content: '';
            position: absolute;
            width: 2px;
            height: 40px;
            background-color: #333;
            bottom: -50px;
            left: 20px;
        }
        
        .star {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: white;
            border-radius: 50%;
            z-index: 1;
            animation: twinkle 2s infinite alternate;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        @keyframes rotate {
            from { transform: rotateX(15deg) rotateY(0deg); }
            to { transform: rotateX(15deg) rotateY(360deg); }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }
        
        @keyframes twinkle {
            from { opacity: 0.3; }
            to { opacity: 1; }
        }
        
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            z-index: 5;
            animation: fall 5s linear infinite;
        }
        
        @keyframes fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        .heart {
            position: absolute;
            font-size: 20px;
            color: #ff6b6b;
            animation: heartFloat 3s infinite ease-in-out;
            z-index: 5;
        }
        
        @keyframes heartFloat {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>生日快乐！</h1>
        <h2>祝爸爸45岁生日快乐！</h2>
        <div class="age">45</div>
        <div class="message">
            <p>亲爱的爸爸，</p>
            <p>今天是您45岁的生日，我衷心祝愿您身体健康，万事如意！</p>
            <p>感谢您一直以来的关爱和支持，您是我生命中最重要的人之一。</p>
            <p>愿您的每一天都充满快乐和幸福，愿您的生活如您所愿，如您所想。</p>
            <p>生日快乐！我爱您！</p>
        </div>
        <div class="gift-box">
            <div class="gift-ribbon"></div>
        </div>
        <div class="buttons">
            <button onclick="showConfetti()">发射彩带</button>
            <button onclick="showHearts()">发射爱心</button>
        </div>
    </div>

    <script>
        // 创建气球
        function createBalloons() {
            const colors = ['#ff6b6b', '#4ecdc4', '#ffd166', '#ff9a9e', '#a5d8ff'];
            for (let i = 0; i < 20; i++) {
                const balloon = document.createElement('div');
                balloon.className = 'balloon';
                balloon.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                balloon.style.left = Math.random() * 100 + 'vw';
                balloon.style.bottom = -50 + 'px';
                balloon.style.animationDelay = Math.random() * 5 + 's';
                document.body.appendChild(balloon);
            }
        }
        
        // 创建星星
        function createStars() {
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + 'vw';
                star.style.top = Math.random() * 100 + 'vh';
                star.style.animationDelay = Math.random() * 2 + 's';
                document.body.appendChild(star);
            }
        }
        
        // 发射彩带
        function showConfetti() {
            const colors = ['#ff6b6b', '#4ecdc4', '#ffd166', '#ff9a9e', '#a5d8ff'];
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 5 + 's';
                document.body.appendChild(confetti);
                
                // 移除彩带元素
                setTimeout(() => {
                    confetti.remove();
                }, 5000);
            }
        }
        
        // 发射爱心
        function showHearts() {
            for (let i = 0; i < 30; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '❤';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDelay = Math.random() * 3 + 's';
                document.body.appendChild(heart);
                
                // 移除爱心元素
                setTimeout(() => {
                    heart.remove();
                }, 3000);
            }
        }
        
        // 页面加载时创建气球和星星
        window.onload = function() {
            createBalloons();
            createStars();
            
            // 每隔一段时间自动发射彩带和爱心
            setInterval(showConfetti, 10000);
            setInterval(showHearts, 15000);
        };
    </script>
</body>
</html>
